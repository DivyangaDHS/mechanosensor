<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Full Project Progress | MECHOSENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>

/* ==========================================================
   COLOR PALETTE
========================================================== */

:root{

    /* Brand Colors */
    --primary:#00AEEF;
    --primary-dark:#008CC0;
    --secondary:#5EC5F0;
    --accent:#E20613;

    /* Backgrounds */
    --page-bg:#F7FBFE;
    --section-bg:#FFFFFF;
    --card-bg:#F3F9FC;
    --card-hover:#EAF6FC;

    /* Text */
    --text:#1F2937;
    --muted:#64748B;

    /* Borders */
    --border:rgba(0,174,239,.15);

    /* Status */
    --success:#38A169;
    --warning:#F0A500;
    --upcoming:#94A3B8;

    /* Shadow */
    --shadow:0 10px 30px rgba(15,23,42,.08);

}


/* ==========================================================
   RESET
========================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top:150px;
}

body{

    font-family:'DM Sans',sans-serif;
    background:var(--page-bg);
    color:var(--text);
    line-height:1.7;

}

a{
    text-decoration:none;
}

.container{

    width:min(1180px,calc(100% - 32px));
    margin:auto;

}


/* ==========================================================
   NAVBAR
========================================================== */

.main-nav{

    position:sticky;
    top:0;
    z-index:1000;

    background:rgba(255,255,255,.92);
    backdrop-filter:blur(20px);

    border-bottom:1px solid var(--border);

}

.main-nav-inner{

    min-height:72px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:20px;

}

.brand{

    font-family:'DM Serif Display',serif;
    font-size:1.3rem;

    color:var(--primary);

}

.brand span{

    color:var(--text);

}

.actions{

    display:flex;
    gap:12px;

}


/* ==========================================================
   BUTTONS
========================================================== */

.btn{

    display:inline-flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    padding:.7rem 1.15rem;

    border-radius:10px;

    font-size:.85rem;
    font-weight:700;

    transition:.3s;

}

.btn-primary{

    background:var(--primary);
    color:white;

}

.btn-primary:hover{

    background:var(--primary-dark);
    transform:translateY(-2px);

}

.btn-outline{

    border:1px solid var(--border);
    color:var(--text);
    background:white;

}

.btn-outline:hover{

    color:var(--primary);
    border-color:var(--primary);

}


/* ==========================================================
   WEEK NAVIGATION
========================================================== */

.week-nav{

    position:sticky;
    top:72px;
    z-index:999;

    background:white;

    border-bottom:1px solid var(--border);

}

.week-nav-inner{

    display:flex;
    gap:10px;

    overflow-x:auto;

    padding:12px 0;

}

.week-nav a{

    flex:0 0 auto;

    padding:8px 13px;

    border-radius:8px;

    background:#EDF8FD;

    border:1px solid var(--border);

    color:var(--muted);

    font-family:'Space Mono',monospace;
    font-size:.72rem;
    font-weight:700;

    transition:.25s;

}

.week-nav a:hover{

    background:var(--primary);
    color:white;

}


/* ==========================================================
   HERO
========================================================== */

.hero{

    padding:70px 0;

    background:
        radial-gradient(circle at 15% 20%,rgba(94,197,240,.25),transparent 35%),
        radial-gradient(circle at 88% 12%,rgba(226,6,19,.06),transparent 28%),
        linear-gradient(180deg,#FFFFFF,var(--page-bg));

}

.label{

    color:var(--primary);

    font-family:'Space Mono',monospace;

    font-size:.75rem;

    letter-spacing:.14em;

    text-transform:uppercase;

    margin-bottom:12px;

}

.hero h1{

    font-family:'DM Serif Display',serif;

    font-size:clamp(2.5rem,6vw,4.8rem);

    line-height:1.05;

    margin-bottom:20px;

}

.hero h1 span{

    color:var(--primary);

}

.hero p{

    max-width:760px;

    color:var(--muted);

}


/* ==========================================================
   OVERALL CARD
========================================================== */

.overall{

    margin-top:35px;

    background:white;

    border-radius:18px;

    padding:28px;

    border:1px solid var(--border);

    box-shadow:var(--shadow);

}

.overall-head{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:15px;

}

.value{

    color:var(--primary);

    font-family:'Space Mono',monospace;

    font-weight:700;

}

.track{

    height:10px;

    border-radius:100px;

    background:#E8EEF4;

    overflow:hidden;

}

.fill{

    width:64%;

    height:100%;

    background:linear-gradient(90deg,var(--primary),var(--secondary));

}

.overall p{

    margin-top:12px;

    color:var(--muted);

}


/* ==========================================================
   WEEK SECTION
========================================================== */

main{

    padding:40px 0 80px;

}

.week{

    margin-bottom:28px;

    background:white;

    border-radius:18px;

    border-left:5px solid var(--upcoming);

    border:1px solid var(--border);

    box-shadow:var(--shadow);

    overflow:hidden;

}

.week.completed{

    border-left-color:var(--success);

}

.week.current{

    border-left-color:var(--primary);

}


/* ==========================================================
   HEADER
========================================================== */

.head{

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:20px;

    padding:26px;

    background:linear-gradient(
        135deg,
        rgba(94,197,240,.18),
        rgba(255,255,255,.95)
    );

}

.heading{

    display:flex;
    gap:15px;

}

.num{

    width:62px;
    height:62px;

    flex:0 0 62px;

    display:grid;
    place-items:center;

    border-radius:14px;

    background:#EAF7FC;

    color:var(--primary);

    font-family:'Space Mono',monospace;
    font-weight:700;

}

.head h2{

    font-family:'DM Serif Display',serif;

    font-size:2rem;

    color:var(--text);

}

.focus{

    color:var(--muted);

    font-size:.9rem;

}

.status{

    padding:6px 14px;

    border-radius:100px;

    color:white;

    font-size:.72rem;

    font-weight:700;

}

.status.completed{

    background:var(--success);

}

.status.current{

    background:var(--primary);

}

.status.upcoming{

    background:var(--upcoming);

}


/* ==========================================================
   BODY
========================================================== */

.body{

    padding:28px;

}

.summary{

    color:var(--muted);

    margin-bottom:25px;

}

.grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:18px;

}

.card{

    background:var(--card-bg);

    border:1px solid var(--border);

    border-radius:14px;

    padding:20px;

    transition:.3s;

}

.card:hover{

    background:var(--card-hover);

    transform:translateY(-5px);

}

.card h3{

    margin-bottom:12px;

    font-size:.95rem;

    color:var(--text);

}

.card h3 i{

    color:var(--primary);

    margin-right:8px;

}

.card p{

    color:var(--muted);

    font-size:.86rem;

}


/* ==========================================================
   PDF BUTTONS
========================================================== */

.resources{

    margin-top:28px;

    padding-top:20px;

    border-top:1px solid var(--border);

    display:flex;
    flex-wrap:wrap;

    gap:10px;

}

.resources strong{

    width:100%;

}

.pdf{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:.7rem 1rem;

    border-radius:10px;

    background:var(--primary);

    color:white;

    font-size:.82rem;

    font-weight:700;

    transition:.3s;

}

.pdf:hover{

    background:var(--primary-dark);

    transform:translateY(-2px);

}


.note{

    width:100%;

    color:var(--muted);

    font-size:.75rem;

}


/* ==========================================================
   BACK TO TOP
========================================================== */

.top{

    position:fixed;

    right:24px;

    bottom:24px;

    width:46px;
    height:46px;

    display:grid;
    place-items:center;

    border-radius:12px;

    background:var(--primary);

    color:white;

    box-shadow:0 8px 18px rgba(0,174,239,.35);

}


/* ==========================================================
   FOOTER
========================================================== */

footer{

    background:#EEF7FC;

    color:var(--muted);

    text-align:center;

    padding:30px;

    border-top:1px solid var(--border);

}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:900px){

.grid{

grid-template-columns:1fr;

}

.head{

flex-direction:column;

}

}

@media(max-width:620px){

html{

scroll-padding-top:145px;

}

.main-nav-inner{

min-height:66px;

}

.week-nav{

top:66px;

}

.btn-outline{

display:none;

}

.heading{

flex-direction:column;

}

.head,
.body{

padding:20px;

}

.num{

width:52px;
height:52px;
flex-basis:52px;

}

}
.detail-list{
    color: var(--muted);
    line-height: 1.9;
    padding-left: 30px;
}

.detail-list li{
    margin-bottom: 10px;
}

</style>

</head>

<body id="top">

<nav class="main-nav"><div class="container main-nav-inner">
<a class="brand" href="index.html"><i class="fas fa-wave-square"></i> <span>MECHO</span>SENSE</a>
<div class="actions"><a class="btn btn-outline" href="index.html#schedule"><i class="fas fa-arrow-left"></i>Progress Summary</a><a class="btn btn-primary" href="index.html"><i class="fas fa-house"></i>Home</a></div>
</div></nav>
<header class="hero"><div class="container"><div class="label">// Test video</div>
</header>

<main>
    <video width="100%" controls>
    <source src="videos/demo.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

</main>
<a class="top" href="#top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></a>

</body></html>
